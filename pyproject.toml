[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-data-analyzer"
version = "1.0.2"
description = "Aplikacja do analizy danych badawczych"
requires-python = ">=3.12"
dependencies = [
    "termcolor",
    "pandas",
    "matplotlib"
]

[project.scripts]
research-analyzer = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "dane",
    "analiza",
    "interface",
    "logowanie",
    "baza",
    "wykresy"
]