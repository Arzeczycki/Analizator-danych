name: Budowanie i uruchamianie Dockera
# workflow_distpach - oznacza że workflow uruchamiany jest ręcznie
on:
    workflow_dispatch:
jobs:
    docker:
        runs-on: ubuntu-24.04
        steps:
            -
                name: Pobieranie kodu
                uses: actions/checkout@v4
            -
                name: Budowanie obrazu
                # -t - skrót od --tag, pozwala nadać obrazowi nazwę
                run: docker build -t research-analyzer .
            -
                name: Uruchamianie aplikacji
                # echo "0" - wypisuje 0 
                # docker run - tworzy i uruchamnia kontener na podstawie obrazu
                # -i - pozwala przekazać 0 do aplikacji (i - input)
                # --name analyzer-test - nadanie kontenerowi nazwy
                # research-analyzer - nazwa obrazu z którego tworzony jest kontener
                run: echo "0" | docker run -i --name analyzer-test research-analyzer 
            -
                name: Wyświetlanie logów aplikacji
                # if always() - próbuje wykonać nawet jeśli poprzednie kroki się nie udadzą
                if: always()
                # pierwsza instrukcja sprawdza czy kontener o tej nazwie w ogóle istnieje
                # docker container inspect - pobiera informacje o kontenerze
                # analyzer-test - nazwa której szuka
                # >/dev/null - ukrywa standardowe wyjścia 
                # 2>&1 - przekieruj komunikaty błedów do tego samego miejsca
                # then - wykona następne instrukcje
                # druga instrukcja sprawdza czy istnieje plik log
                run: |
                    if docker container inspect analyzer-test >/dev/null 2>&1; then
                        if docker cp analyzer-test:/app/logs/app.log ./app.log; then
                            cat app.log
                        else
                            echo "Nie udało się pobrać danych z kontenera"
                        fi
                    else 
                        echo "Kontener analyzer-test nie został utworzony"
                    fi